name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  # the style guide, as far as a machine can hold it. no toolchain and no
  # build, so this is the fastest possible answer to a pull request, and it
  # is the one that should come back first
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: style lint
        run: make lint

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # the runner takes its packages from ubuntu's amd64v3 archive, and
      # musl's static libc there is built for a cpu with avx2, which the
      # selftests would link into programs for any x86_64. no variants
      # is the plain amd64 archive, and said on the command line it wins
      # over the runner's own apt.conf.d, whatever its files are called
      - name: install the toolchain
        run: |
          sudo apt-get -o APT::Architecture-Variants= update -qq
          sudo apt-get -o APT::Architecture-Variants= install -y \
            --no-install-recommends nasm musl-tools qemu-system-x86

      - name: versions, for when something inevitably breaks
        run: |
          gcc --version | head -1
          gcc -Q --help=target | grep -m1 'march='
          nasm -v
          dpkg-query -W musl-tools
          qemu-system-x86_64 --version | head -1

      # the fast feedback first: these are ordinary linux programs and
      # they catch most of what a boot test would
      - name: host tests
        run: make test

      - name: build the kernel
        run: make

      # philemon writes a disk image and that is what boots. the medium in
      # it has no programs, so this is the kernel on its own
      - name: boot test
        run: make boottest

      # and ring 3, from where a program stands: the selftests, built
      # with musl, a libc that has never heard of this kernel, and run as
      # guest. one that fails is a program broken somewhere, and the
      # kernel does not break userspace
      - name: selftests
        run: make kselftest

      - name: keep the boot image and the serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velvet-boot
          path: |
            velvet.img
            bin/*-boottest.log
            bin/*-kselftest.log
          if-no-files-found: warn
