name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  # the style guide, as far as a machine can hold it. no toolchain and no
  # build, so this is the fastest possible answer to a pull request, and it
  # is the one that should come back first
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: style lint
        run: make lint

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: install the toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            nasm qemu-system-x86

      - name: versions, for when something inevitably breaks
        run: |
          gcc --version | head -1
          nasm -v
          qemu-system-x86_64 --version | head -1

      # the fast feedback first: these are ordinary linux programs and
      # they catch most of what a boot test would
      - name: host tests
        run: make test

      - name: build the kernel
        run: make

      # philemon writes a disk image and that is what boots. the medium in
      # it has no programs, so this is the kernel on its own: ring 3 is
      # checked by velvetOS's CI, on every kernel it pins
      - name: boot test
        run: make boottest

      - name: keep the boot image and the serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velvet-boot
          path: |
            velvet.img
            bin/*-boottest.log
          if-no-files-found: warn
